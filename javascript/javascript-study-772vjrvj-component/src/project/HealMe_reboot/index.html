<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
<header class="header">
    <div class="container">
        <a href="#" class="logo">
            <img src="images/healme_logo.png" alt="Heal Me Logo" />
        </a>

        <input type="checkbox" id="check" />
        <label for="check" class="icons">
            <i class="bx bx-menu" id="menu-icon"></i>
            <i class="bx bx-x" id="close-icon"></i>
        </label>

        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="#" style="--i:0;">업종별</a></li>
                <li><a href="#" style="--i:1;">지역별</a></li>
                <li><a href="#" style="--i:2;">내주변</a></li>
                <li><a href="#" style="--i:3;">게시판</a></li>
                <li><a href="#" style="--i:4;">제휴톡</a></li>
                <li class="mobile-login"><a href="#" style="--i:4;">로그인</a></li> <!-- ✅ 추가 -->
            </ul>
        </nav>

        <div class="right-box">
            <i class='bx bx-user'></i>
        </div>

    </div>
</header>
</body>
</html>
